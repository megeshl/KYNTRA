version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kyntra-postgres
    environment:
      POSTGRES_USER: kyntra
      POSTGRES_PASSWORD: kyntra_secret
      POSTGRES_DB: kyntra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
